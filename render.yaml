services:
  # 1. FastAPI Backend API & AI Engine
  - type: web
    name: railoptix-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: railoptix-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://railoptix-frontend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480

  # 2. React Frontend Single Page Application
  - type: web
    name: railoptix-frontend
    runtime: static
    buildCommand: "cd client && npm install && npm run build"
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: "https://railoptix-api.onrender.com"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://railoptix-api.onrender.com/api/$1
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed PostgreSQL Database
  - name: railoptix-postgres
    databaseName: railopt
    user: railopt
    plan: free
